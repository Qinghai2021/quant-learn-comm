<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量化策略实盘学习记录分享 | 主页</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-card: #ffffff;
            --border-color: #e0e0e0;
            --gold: #c5943e;
            --gold-light: #e6b567;
            --text-primary: #1e2235;
            --text-secondary: #5a6072;
            --text-muted: #7b8090;
            --green: #00a854;
            --red: #e54545;
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            --font-sans: 'Inter', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --radius-lg: 14px;
            --shadow-card: 0 4px 12px rgba(0,0,0,0.06);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            background-image: none;
        }
        .header {
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            padding: 20px 40px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p {
            color: var(--text-secondary);
            margin-top: 8px;
            font-size: 0.95rem;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 24px;
        }
        .strategy-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-card);
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
        }
        .strategy-card:hover {
            transform: translateY(-4px);
            border-color: var(--gold);
        }
        .strategy-name {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-primary);
        }
        .strategy-desc {
            color: var(--text-secondary);
            font-size: 0.88rem;
            margin-bottom: 6px;
        }
        .days-badge {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--gold);
            background: rgba(197,148,62,0.1);
            padding: 2px 10px;
            border-radius: 20px;
            margin-bottom: 18px;
            width: fit-content;
            letter-spacing: 0.5px;
            border: 1px solid rgba(197,148,62,0.25);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-item { display: flex; flex-direction: column; align-items: center; }
        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 2px;
        }
        .stat-value {
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 1rem;
        }
        .stat-value.green { color: var(--green); }
        .stat-value.red { color: var(--red); }
        .view-btn {
            display: inline-block;
            width: 100%;
            text-align: center;
            padding: 10px 0;
            border-radius: 8px;
            background: rgba(197,148,62,0.1);
            border: 1px solid var(--gold);
            color: var(--gold);
            font-weight: 600;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            transition: background 0.2s;
            margin-top: auto;
        }
        .view-btn:hover { background: rgba(197,148,62,0.2); }
        .footer {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 0.75rem;
            border-top: 1px solid var(--border-color);
            margin-top: 40px;
        }
        .loading-message {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>量化策略实盘记录</h1>
        <p>多策略组合 · 透明化净值追踪</p>
    </header>

    <div class="container" id="cardsContainer">
        <div class="loading-message">加载策略数据中...</div>
    </div>

    <div class="footer">
        <p>数据更新于 <span id="updateDate">--</span> · 所有内容仅供学习参考，不构成投资建议</p>
    </div>

    <script>
        (async function() {
            const container = document.getElementById('cardsContainer');
            const updateDateSpan = document.getElementById('updateDate');
            
            try {
                const response = await fetch('./strategies.json');
                if (!response.ok) throw new Error('无法加载策略数据');
                const strategies = await response.json();
                
                container.innerHTML = '';
                
                strategies.forEach(s => {
                    const card = document.createElement('div');
                    card.className = 'strategy-card';
                    card.innerHTML = `
                        <div class="strategy-name">${s.name}</div>
                        <div class="strategy-desc">${s.description}</div>
                        <div class="days-badge">🗓️ 实盘天数 ${s.days} 天</div>
                        <div class="stats-grid">
                            <div class="stat-item">
                                <span class="stat-label">收益率</span>
                                <span class="stat-value green">${s.returnRate}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">最大回撤</span>
                                <span class="stat-value red">${s.drawdown}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">胜率</span>
                                <span class="stat-value green">${s.winRate}</span>
                            </div>
                        </div>
                        <a href="${s.page}" class="view-btn">查看实盘详情 →</a>
                    `;
                    container.appendChild(card);
                });

                updateDateSpan.textContent = new Date().toISOString().split('T')[0];
            } catch (error) {
                container.innerHTML = '<div class="loading-message">策略数据加载失败，请检查 strategies.json 文件</div>';
                console.error(error);
            }
        })();
    </script>
</body>
</html>
